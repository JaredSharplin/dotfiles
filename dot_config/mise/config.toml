# Versions track payaus (.ruby-version, mise.toml). Node follows the LTS major, like payaus's
# mise.toml, so `mise upgrade` picks up security patches.
[tools]
node = "24"
ruby = "3.4.9"
yarn = "4.16.0"

[settings]
# payaus's Ruby lives in .ruby-version, which mise ignores without this.
idiomatic_version_file_enable_tools = ["ruby", "node"]
