# Versions track payaus (.ruby-version, .nvmrc, mise.toml). Exact, not major-only: payaus's
# node.pp greps `mise list node` for the literal .nvmrc string.
[tools]
node = "24.16.0"
ruby = "3.4.9"
yarn = "4.16.0"

[settings]
# payaus's Ruby lives in .ruby-version, which mise ignores without this.
idiomatic_version_file_enable_tools = ["ruby", "node"]
