prSections:
- title: My Open Pull Requests
  filters: is:open author:@me
  type: null
- title: Needs My Review
  filters: is:open review-requested:@me
  type: null
- title: Involved
  filters: is:open involves:@me -author:@me
  type: null
- title: Is Open
  filters: is:open repo:TandaHQ/payaus
  type: null
- title: My Pull Requests
  filters: author:@me
  type: null
- title: All
  filters: repo:TandaHQ/payaus
  type: null
issuesSections:
- title: My Issues
  filters: is:open author:@me
- title: Assigned
  filters: is:open assignee:@me
- title: Involved
  filters: is:open involves:@me -author:@me
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 80
    position: bottom
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 5
keybindings:
  universal: []
  issues: []
  prs:
    # Literal login, not "@me": gh only expands it for --add-assignee.
    - key: "+"
      name: request-my-review
      command: gh pr edit {{.PrNumber}} --repo {{.RepoName}} --add-reviewer JaredSharplin
    # No field flags on purpose: gh drops into its interactive picker, and "Body"
    # opens $EDITOR prefilled. No flag does that directly.
    - key: "E"
      name: edit-pr
      command: gh pr edit {{.PrNumber}} --repo {{.RepoName}}
    - key: n
      name: review
      command: >-
        nvim -c 'lua vim.schedule(function()
        vim.cmd.edit("gh://{{.RepoName}}/pr/{{.PrNumber}}")
        end)'
    # Same buffer, but over a checkout so fixes can be edited with LSP and pushed.
    - key: N
      name: review-in-worktree
      command: gh-review-worktree {{.RepoName}} {{.PrNumber}} {{.HeadRefName}}
    - key: i
      name: screenshots
      command: gh-pr-shots {{.RepoName}} {{.PrNumber}}
  branches: []
repoPaths:
  TandaHQ/*: ~/programming/*
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
