# Personal, cross-project write-rules enforced by
# ~/.claude/hooks/personal-write-rules-check.rb on Edit / MultiEdit / Write /
# Bash tool calls, in every repo. New rules are YAML entries here — no new
# scripts. Schema (type / files / pattern / bash_writes / bash_pattern /
# context / context_script / opt_out_env / opt_in_env) is documented in full
# at the top of personal-write-rules-check.rb.
#
# This file is read ONLY by the personal dispatcher, never by a project's own
# write-rules-check.rb — so a personal rule and a project rule can share a name
# without colliding (sentinels are namespaced under personal-write-rules/).

controller_view_helper_reach:
  type: warn
  files:
    - 'app/controllers/**/*.rb'
  pattern: '\bhelpers\.|^\s*helper\s+[A-Z:]'
  context: >
    Don't couple a controller to the view-helper layer — neither by reaching into a
    helper at runtime (`helpers.…`) nor by including one (`helper SomeHelper` /
    `helper :all`). Both mix presentation into routing and data loading.
    If the logic is about a record (how it names/describes itself), move it to the
    model (e.g. DataStreamJoin#data_streamable_name) or a plain object. If a shared
    partial needs view helpers, put them in their own helper module and `include` it
    into the helper modules that need it (helper-includes-helper) — the controller's
    name-matched helper (FooController -> FooHelper) is auto-included, so wire shared
    helpers through that, never through the `helper` macro.
