# standardrb's style is fixed by design — there are no rule settings here, and
# adding any would defeat the reason this repo is on standardrb and not rubocop.
#
# Standard already ignores .git, node_modules, vendor, bin/*, db/schema.rb and
# tmp. These two are extra because standard would otherwise lint them.
ignore:
  - "Brewfile"        # Homebrew DSL, not our code
  - ".ruby-lsp/**/*"  # generated by ruby-lsp
